<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge AI | Bridging Education & Employment</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="app">
        <!-- Navigation -->
        <nav class="glass-nav">
            <div class="logo">
                <i class="fa-solid fa-bridge-water"></i> SkillBridge<span class="highlight">AI</span>
            </div>
            <div class="nav-links">
                <button id="nav-home" class="nav-btn active" data-tab="home">Home</button>
                <button id="nav-skill-match" class="nav-btn" data-tab="skill-match">Skill Match</button>
                <button id="nav-resume-check" class="nav-btn" data-tab="resume-check">Resume Check</button>
                <button id="nav-job-board" class="nav-btn" data-tab="job-board">Job Board</button>
            </div>
            <div class="user-profile">
                <div class="avatar">DA</div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="content-container">
            <!-- Dynamic Content Injected Here via JS -->
        </main>
    </div>

    <!-- PDF.js for Resume Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Scripts -->
    <script src="js/mockService.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
